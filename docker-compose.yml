services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=admin@chatmagal.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - proxy

  web:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.chatmagal223.rule=Host(`chatmagal.com`) || Host(`www.chatmagal.com`)
      - traefik.http.routers.chatmagal223.entrypoints=websecure
      - traefik.http.routers.chatmagal223.tls=true
      - traefik.http.routers.chatmagal223.tls.certresolver=letsencrypt
      - traefik.http.services.chatmagal223.loadbalancer.server.port=3000
    restart: unless-stopped
    networks:
      - proxy
      - internal

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - internal

volumes:
  letsencrypt:
  db_data:

networks:
  proxy:
    external: true
  internal:
    internal: true
